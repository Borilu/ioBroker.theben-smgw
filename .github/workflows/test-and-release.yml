name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      # These two patterns are required by the ioBroker repository checker.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
      # GitHub uses globs, not regular expressions; this pattern matches v0.3.2.
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in package.json to npm
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          extra-tests: npm test

  # Publish on an explicit version-tag push, or a manual dispatch from main,
  # only after all tests pass. npm trusted publishing must be configured first.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - id: package-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid package version' >&2
            exit 1
          fi
          adapter_version="$(node -p "require('./io-package.json').common.version")"
          if [[ "$version" != "$adapter_version" ]]; then
            echo 'Package and io-package versions differ' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag does not match package version' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          tag: ${{ steps.package-version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
